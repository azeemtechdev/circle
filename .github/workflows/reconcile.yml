name: Nightly reconciliation

# PLAN.md §4 invariant 6: a job that verifies the ledger still sums to zero,
# every transfer is balanced, and no circle has drifted. Any drift fails the
# run loudly rather than reporting a comfortable nothing.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: verify ledger invariants
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reconcile
        run: npm run reconcile
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          # reconcile_ledger() is not granted to anon on purpose — an anonymous
          # visitor has no business auditing the books.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
