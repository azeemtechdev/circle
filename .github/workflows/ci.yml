name: CI

on:
  push:
  pull_request:

# A new push to the same branch cancels the previous run — free-tier minutes
# are finite and only the newest commit matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint + typecheck + tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Must match the dev machine's major. package-lock.json is written by
      # npm 11 (Node 24); npm 10 (which Node 22 bundles) rejects it with
      # "Missing: @emnapi/runtime@1.11.3 from lock file" — npm omits some
      # transitive deps of the wasm32-wasi optional packages that older npm
      # then insists on. Pinning the major keeps `npm ci` deterministic.
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      # Printed before install so a failing run says which toolchain produced it.
      - name: Toolchain versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Unit tests always run. The Supabase smoke test runs only when the repo
      # secrets exist (they are absent on forked PRs) and skips itself otherwise
      # — see tests/supabase.smoke.test.ts.
      - name: Tests
        run: npm run test
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
