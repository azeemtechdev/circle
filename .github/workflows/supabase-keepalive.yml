name: Supabase keep-alive

# Supabase's free Postgres tier pauses a project after roughly a week of
# inactivity (PLAN.md §3, gotcha 1). A weekly request keeps it warm so the
# database is never found paused at the start of a session.
on:
  schedule:
    # Every Monday at 06:00 UTC. GitHub may delay scheduled runs under load;
    # weekly-with-slack is well inside the pause window.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  ping:
    name: query the database
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::Supabase secrets are not set on this repository."
            echo "Add NEXT_PUBLIC_SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY"
            echo "under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # This is a real SELECT against a real table, not a health check.
          # /auth/v1/health proves the project is up, but the pause timer counts
          # DATABASE activity, so a health check could let the project pause
          # while this workflow reported success every week.
          #
          # service_role rather than anon because anon holds no select grant on
          # any table (0002, 0004) and would get a 401 — which would be a
          # liveness check again, not a query.
          #
          # `profiles` is the table chosen on purpose: it has existed since 0004
          # and is not going away. An empty result is a pass; reaching Postgres
          # is the point, not what comes back.
          status=$(curl --silent --show-error --location \
            --max-time 30 \
            --output /tmp/keepalive-body \
            --write-out '%{http_code}' \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            "${SUPABASE_URL%/}/rest/v1/profiles?select=id&limit=1")

          echo "Supabase responded with HTTP ${status}"

          if [ "${status}" != "200" ]; then
            echo "::error::Expected HTTP 200 from a SELECT. The project may be paused, the key rotated, or the table missing."
            cat /tmp/keepalive-body
            exit 1
          fi
